# Hard rule: no secret in this repository. Runs the same sweep as the pre-commit hook, on the whole tree and on
# every commit ever made, so that a commit made with the hook switched off is still caught.
name: Secret sweep

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secret in the tree
        run: python3 scripts/secret_sweep.py --tree
      - name: No secret in any commit
        run: python3 scripts/secret_sweep.py --history
