name: Bug report
description: A script or a check that does the wrong thing.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command and its output. Cut any secret, personal data or internal address out of the output first.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Operating system, Python version, bash version (`bash --version`).
    validations:
      required: true
  - type: checkboxes
    id: safe
    attributes:
      label: Nothing private
      options:
        - label: This report holds no secret, no personal data and no internal address.
          required: true
