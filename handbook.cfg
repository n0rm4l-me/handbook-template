# Settings of this handbook, read by scripts/tier0.py, scripts/stalest.py and scripts/make-index.sh. A mistake here (an unknown key, a
# value that is not allowed) is a blocking finding, because a setting that is silently ignored is a trap. The first-run interview
# (FIRST-RUN.md, E2 and E3) decides the first two values. Write one `key = value` per line and keep a comment on a line of its own:
# a `#` after a value is part of the value.
[handbook]
# strict: pages are English with plain punctuation, no em dash, and no quoted conversations (Tier 0 checks it).
# off: none of those three checks runs. Use off when the pages are written in another language.
record_style = strict
# A page marked verified that was last verified more than this many days ago gets a warning.
verified_max_age_days = 30
# The folders whose pages INDEX.md lists, comma-separated, relative to the root; the folders inside them are listed too. Rename them to
# fit the team (a QA team may want test-strategy, runbooks, process, reference). Move the folders and change this line together, and the
# links that name a folder (CLAUDE.md links to the pages of process/, for one): Tier 0 reports a link that is broken.
index_folders = architecture, operations, process, reference
# The folders of dated records (a release, a postmortem, a retrospective, the result of a measurement run). A record does not become
# false with time, so it never gets the age warning and the Tier 2 list of scripts/stalest.py leaves it out. May be empty.
record_folders = operations/releases, architecture/retrospectives
